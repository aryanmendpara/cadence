[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
directories = "6"
cpal = "0.18"
rubato = "5"
rtrb = "0.3"
symphonia = { version = "0.6", default-features = false }
lofty = "0.25"
walkdir = "2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2"

